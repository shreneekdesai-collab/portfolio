name: Update stats

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-stats.js'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update stats
        run: node scripts/update-stats.js
      - name: Commit changed stats
        run: |
          if git diff --quiet -- data/stats.json; then
            echo "No stats changes to commit."
            exit 0
          fi
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add data/stats.json
          git commit -m "chore: update problem stats"
          git push
